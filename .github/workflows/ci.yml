name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (nvim ${{ matrix.neovim }}, telescope ${{ matrix.telescope.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor: the first Telescope release whose minimum is Neovim 0.10.4.
          - neovim: v0.10.4
            telescope: { name: v0.2.0, ref: v0.2.0 }
          # The newest 0.1.x release, on Neovim 0.10.
          - neovim: v0.10.4
            telescope: { name: v0.1.9, ref: v0.1.9 }
          - neovim: v0.11.7
            telescope: { name: v0.2.2, ref: v0.2.2 }
          # The current pair: Telescope master, pinned to a commit that is moved by hand.
          - neovim: v0.12.6
            telescope: { name: master, ref: 1e1bab730218eaf97fce743be3f56e51075928ac }
    uses: ./.github/workflows/test.yml
    with:
      os: ubuntu-latest
      neovim: ${{ matrix.neovim }}
      telescope: ${{ matrix.telescope.ref }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stylua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.6.0
          args: --version

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck

      - name: Lint
        run: make lint

  # One check whose name does not change with the matrix, so a branch ruleset can
  # require it. It fails unless every job above passed.
  tests:
    name: tests
    needs: [test, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed
        run: |
          echo "test: ${{ needs.test.result }}, lint: ${{ needs.lint.result }}"
          [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.lint.result }}" = "success" ]
